[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "1.0.0"
description = "Lightweight phishing URL analyzer with explainable risk verdicts"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santhosh L" }]
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
threatlens = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
